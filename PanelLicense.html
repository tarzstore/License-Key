<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c11">
  <title>LICENSE RESELLER - Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0a0c11; --surface:#12151c; --raised:#181c26; --field:#0e1117;
      --line:#242a38; --line2:#303849;
      --text:#eceff6; --muted:#8c94a8;
      --blue:#5b8def; --blue2:#8db3ff; --green:#3ecf8e; --red:#f06a6a; --amber:#f5b73d;
      --r-card:14px; --r-ctl:10px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    .hidden{display:none!important}
    html,body{height:100%}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{max-width:1040px;margin:0 auto;padding:0 20px 110px}
    svg.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
    .glass{background:var(--surface);border:1px solid var(--line)}

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:10;padding:12px 20px;margin-bottom:24px;background:rgba(10,12,17,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:-.01em}
    .brand span{color:var(--blue2)}
    .brand .logo{width:32px;height:32px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
    .brand .logo svg{width:16px;height:16px}
    .who-pill{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--muted)}
    .who-pill b{color:var(--text);font-weight:600}
    .who-pill .avatar{width:24px;height:24px;border-radius:50%;background:var(--green);color:#05261a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .who-pill button{padding:5px 11px!important;font-size:12px!important;border-radius:999px!important}

    /* Login */
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .login-page::before{content:"";position:absolute;width:520px;height:520px;top:-220px;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(91,141,239,.2),transparent 68%);pointer-events:none}
    .login-box{width:100%;max-width:380px;position:relative;z-index:1;animation:rise .4s cubic-bezier(.16,1,.3,1)}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
    .login-brand .logo{width:56px;height:56px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .login-brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center}
    .login-brand h1 span{color:var(--blue2)}
    .login-brand p{margin:0;color:var(--muted);font-size:13px;text-align:center}
    .login-card{border-radius:18px;padding:24px}
    .field-group{margin-bottom:14px}
    .field-group label{display:flex;align-items:center;gap:6px;margin:0 0 7px;color:var(--muted);font-size:12.5px;font-weight:600}
    .field-group label svg.icon{display:none}
    .input-wrap{position:relative;display:flex;align-items:center}
    .input-wrap svg.icon.leading{position:absolute;left:13px;width:16px;height:16px;color:var(--muted);pointer-events:none}
    .input-wrap input{margin:0;padding-left:40px;height:46px}
    .input-wrap input#password{padding-right:44px}
    .pw-toggle{position:absolute;right:5px;width:36px;height:36px;padding:0!important;background:transparent!important;border:0!important;color:var(--muted)!important}
    .pw-toggle:hover:not(:disabled){color:var(--text)!important;background:rgba(255,255,255,.06)!important}
    .pw-toggle svg.icon{width:16px;height:16px}
    #loginBtn{width:100%;height:46px;margin-top:6px;font-size:14px}
    .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
    #loginBtn.loading .spinner,#genBtn.loading .spinner{display:inline-block}
    #loginBtn.loading .btn-label,#genBtn.loading .btn-label{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .login-msg{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:var(--r-ctl);font-size:12.5px;line-height:1.4}
    .login-msg:empty{display:none;margin:0;padding:0}
    .login-msg svg.icon{width:15px;height:15px}
    .login-msg.err{color:#fca5a5;background:rgba(240,106,106,.1);border:1px solid rgba(240,106,106,.28)}
    .login-msg.ok{color:#86efac;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.28)}
    .login-msg.info{color:var(--muted);background:var(--raised);border:1px solid var(--line)}
    .login-foot{text-align:center;margin-top:18px;color:var(--muted);font-size:12px}

    /* Base controls */
    .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
    .card{border-radius:var(--r-card);padding:20px;margin-bottom:16px}
    label{display:block;color:var(--muted);font-size:12.5px;margin:0 0 6px;font-weight:600}
    input,select{width:100%;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--field);color:var(--text);padding:11px 12px;outline:none;font:inherit;font-size:14px;transition:border-color .15s,box-shadow .15s}
    input::placeholder{color:#5f6779}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,141,239,.18)}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:start;margin-bottom:6px}
    .row input{margin:0}
    .row button{height:44px}
    button{border:1px solid transparent;border-radius:var(--r-ctl);background:var(--blue);color:#fff;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .06s,border-color .15s;outline:none}
    button:hover:not(:disabled){background:#6e9bf3}
    button:active:not(:disabled){transform:scale(.97)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
    button.secondary{background:var(--raised);border-color:var(--line2);color:var(--text)}
    button.secondary:hover:not(:disabled){background:#202636}
    button.danger{background:rgba(240,106,106,.14);border-color:rgba(240,106,106,.35);color:#ff9a9a}
    button.danger:hover:not(:disabled){background:rgba(240,106,106,.24)}
    button.green{background:var(--green);color:#05261a}
    button.green:hover:not(:disabled){background:#56dba2}
    button:disabled{opacity:.5;cursor:not-allowed}
    .msg{min-height:0;color:var(--muted);font-size:12.5px;margin:0 0 8px}
    .msg:empty{display:none}
    code{font-family:var(--mono);color:var(--blue2);font-weight:600;font-size:12.5px;word-break:break-all}

    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
    .stat{border-radius:var(--r-card);padding:14px 16px}
    .stat small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600}
    .stat small svg.icon{width:15px;height:15px}
    .stat strong{display:block;margin-top:6px;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .stat-blue small svg.icon,.stat-blue strong{color:var(--blue2)}
    .stat-green small svg.icon,.stat-green strong{color:var(--green)}
    .stat-red small svg.icon,.stat-red strong{color:var(--red)}
    .stat-amber small svg.icon,.stat-amber strong{color:var(--amber)}
    h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:15px;font-weight:700;letter-spacing:-.01em}
    h2 svg.icon{width:17px;height:17px;color:var(--blue2)}
    .h2-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
    .h2-row h2{margin:0}
    .h2-row+.sub{margin-top:0!important}

    /* Lists */
    .keylist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .keyrow{background:var(--raised);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
    .keyrow:hover{border-color:var(--line2)}
    /* ===== Lihat key user ===== */
    #keyCard{padding:18px}
    .kv-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .kv-back{width:38px;height:38px;padding:0;flex:none;border-radius:11px}
    .kv-back svg.icon{width:18px;height:18px}
    .kv-ava{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
    .kv-title{min-width:0;flex:1}
    .kv-title b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kv-title small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
    .kv-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .kv-sum{padding:10px 6px;border-radius:12px;background:var(--field);border:1px solid var(--line);text-align:center}
    .kv-sum b{display:block;font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
    .kv-sum small{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:600}
    .kv-sum.g b{color:var(--green)} .kv-sum.r b{color:var(--red)} .kv-sum.a b{color:var(--amber)}
    .kv-filters{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
    .kv-filters::-webkit-scrollbar{display:none}
    .kv-filters button{flex:none;padding:6px 13px;font-size:12.5px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
    .kv-filters button:hover:not(:disabled){background:var(--raised);color:var(--text)}
    .kv-filters button.active{background:rgba(91,141,239,.14);border-color:rgba(91,141,239,.45);color:var(--blue2)}
    #keyCard .toolbar{margin-bottom:12px}
    #keyCard .keylist{margin-top:6px;gap:10px}

    .keyrow{background:var(--raised);border:1px solid var(--line);border-radius:14px;transition:border-color .15s,background .15s}
    .keyrow:hover{border-color:var(--line2);background:#1b202c}
    .kr-body{position:relative;padding:14px 14px 12px 18px}
    .kr-body::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--muted);opacity:.5}
    .keyrow.st-active .kr-body::before{background:var(--green);opacity:1}
    .keyrow.st-expired .kr-body::before{background:var(--red);opacity:1}
    .kr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
    .kr-head-main{min-width:0;flex:1}
    .kr-title{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kr-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
    .kr-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:var(--muted);background:var(--field);border:1px solid var(--line)}
    .kr-badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .kr-badge.s-active{color:var(--green);background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3)}
    .kr-badge.s-expired{color:var(--red);background:rgba(240,106,106,.1);border-color:rgba(240,106,106,.3)}
    .kr-badge.t-vip{color:var(--amber);background:rgba(245,183,61,.1);border-color:rgba(245,183,61,.3)}
    .kr-badge.t-free{color:var(--blue2);background:rgba(91,141,239,.1);border-color:rgba(91,141,239,.3)}
    .kr-badge.t-res{color:var(--green);background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3)}
    .kr-keybox{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border-radius:11px;background:var(--field);border:1px dashed var(--line2);color:var(--text);text-align:left;font-weight:500}
    .kr-keybox:hover:not(:disabled){background:rgba(91,141,239,.07);border-color:rgba(91,141,239,.5)}
    .kr-keybox code{font-size:13.5px;letter-spacing:.02em}
    .kr-keybox svg.icon{width:15px;height:15px;color:var(--muted)}
    .kr-keybox:hover svg.icon{color:var(--blue2)}
    .kr-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .kr-field{display:flex;flex-direction:column;gap:4px;min-width:0;padding:10px 12px;border-radius:11px;background:var(--field);border:1px solid var(--line)}
    .kr-field small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;font-weight:600}
    .kr-field small svg.icon{width:12px;height:12px}
    .kr-field b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
    .kr-field b.exp-soon{color:var(--amber)}
    .kr-field b.exp-out{color:var(--red)}
    .kr-field b.exp-never{color:var(--green)}
    .kr-field b.ok{color:var(--green)}
    .kr-field b.full{color:var(--red)}
    .kr-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
    .kr-bar i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .3s}
    .kr-bar.full i{background:var(--red)}
    .kr-foot{margin-top:10px;color:var(--muted);font-size:11.5px}
    .kr-actions{position:relative;flex:none}
    .kr-actions>button{width:34px;height:34px;padding:0;margin:-4px -4px 0 0;border-radius:9px;background:transparent;border-color:transparent;color:var(--muted)}
    .kr-actions>button:hover:not(:disabled){background:var(--field);color:var(--text)}
    .kr-actions>button svg.icon{width:16px;height:16px}
    .res-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
    .res-left{display:flex;align-items:center;gap:12px;min-width:0}
    .res-row b{font-size:14px;font-weight:600}
    .res-row small{display:block;color:var(--muted);font-size:12.5px}
    .res-row .res-btns{display:flex;gap:6px}
    .res-row .res-btns button{padding:7px 12px;font-size:12.5px}
    #resAppList .res-row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #resAppList .res-thumb{pointer-events:none;-webkit-user-drag:none}
    .res-row.dragging{position:relative;z-index:5;background:#202636;border-color:var(--blue);box-shadow:0 14px 30px rgba(0,0,0,.55);cursor:grabbing}
    .reordering{cursor:grabbing}
    .res-row.is-off .res-left{opacity:.5}
    .res-thumb,#resLogoPrev{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
    .keylist-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:12px}
    .keylist-empty svg.icon{width:28px;height:28px;opacity:.5}

    /* Action menu: dropdown on desktop, bottom sheet on mobile */
    .kr-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:230px;padding:6px;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:rise .14s ease-out}
    .kr-menu.open{display:flex}
    .kr-menu-head{display:none;align-items:center;justify-content:space-between;padding:4px 6px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
    .kr-menu-head span{font-size:14px;font-weight:700}
    .kr-menu-close{width:32px;height:32px;padding:0;border-radius:9px;background:var(--raised);border-color:var(--line2);color:var(--text)}
    .kr-menu .kr-menu-close{width:36px;height:36px;min-height:0;padding:0;justify-content:center;flex:none;background:var(--raised);border:1px solid var(--line2)}
    .kr-menu .kr-menu-close:hover:not(:disabled){background:#202636}
    .kr-menu-close svg.icon{width:16px;height:16px}
    .kr-menu button{justify-content:flex-start;gap:11px;padding:9px 12px;border-radius:8px;background:transparent;color:var(--text);font-weight:500;font-size:13.5px;text-align:left}
    .kr-menu button svg.icon{width:16px;height:16px;color:var(--muted)}
    .kr-menu button.danger-text svg.icon{color:var(--red)}
    .kr-menu-label{padding:6px 12px 3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    .kr-menu button:hover:not(:disabled){background:var(--raised)}
    .kr-menu button.danger-text{color:var(--red)}
    .kr-menu button.danger-text:hover:not(:disabled){background:rgba(240,106,106,.12)}
    .kr-menu-sep{height:1px;margin:4px 2px;background:var(--line);flex:none}

    /* Tabs, toolbar */
    .tabs{display:flex;gap:4px;margin:14px 0;padding:4px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
    .tab-btn{flex:1;background:transparent;border:0;color:var(--muted);padding:9px 12px;border-radius:9px;font-weight:600}
    .tab-btn:hover:not(:disabled){background:var(--raised);color:var(--text)}
    .tab-btn .tab-count{margin-left:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--raised);color:var(--muted)}
    .tab-btn.active{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
    .tab-btn.active[data-tab="vip"]{color:var(--amber)}
    .tab-btn.active[data-tab="free"]{color:var(--blue2)}
    .tab-btn.active[data-ctab="credit"]{color:var(--blue2)}
    .tab-btn.active[data-ctab="nocredit"]{color:var(--amber)}
    #credTabs{margin:0 0 12px}
    .cred-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
    .cred-stat{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,var(--raised),var(--field))}
    .cred-stat .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(91,141,239,.14);color:var(--blue2)}
    .cred-stat .ic.g{background:rgba(62,207,142,.14);color:var(--green)}
    .cred-stat .ic svg.icon{width:18px;height:18px}
    .cred-stat b{display:block;font-size:20px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
    .cred-stat small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
    #credList{gap:8px;max-height:min(440px,60vh);overflow-y:auto;overscroll-behavior:contain;padding-right:4px;margin-right:-4px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
    #credList::-webkit-scrollbar{width:6px}
    #credList::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
    #credSearch{margin:0 0 10px}
    .count-pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--raised);border:1px solid var(--line)}
    .app-hint{margin:2px 0 0;color:var(--muted);font-size:12.5px}
    #resAppList{gap:8px;margin-top:12px}
    #resAppList .app-row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px;border-radius:14px;transition:border-color .15s,background .15s}
    #resAppList .app-row:hover{border-color:var(--line2);background:#1b202c}
    #resAppList .app-row.dragging:hover{background:#202636;border-color:var(--blue)}
    .app-grip{flex:none;display:flex;align-items:center;color:var(--line2);pointer-events:none}
    .app-grip svg.icon{width:16px;height:16px}
    .app-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;transition:opacity .15s}
    .app-row.is-off .app-main{opacity:.5}
    .app-ava{position:relative;width:46px;height:46px;border-radius:12px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
    .app-ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
    .app-info{min-width:0}
    .app-info b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .app-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
    .app-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--field);border:1px solid var(--line);white-space:nowrap}
    .app-chip.mono{font-family:var(--mono);font-weight:500;color:var(--text)}
    .app-chip svg.icon{width:11px;height:11px}
    .app-chip.on{color:var(--green);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.1)}
    .app-chip.on::before,.app-chip.off::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .app-actions{display:flex;align-items:center;gap:6px;flex:none}
    #resAppList .app-toggle{gap:8px;padding:4px 8px 4px 4px;background:transparent;border:0;color:var(--muted);font-size:12.5px;min-height:0;border-radius:999px}
    #resAppList .app-toggle:hover:not(:disabled){background:var(--field)}
    .app-toggle .track{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line2);flex:none;transition:background .18s}
    .app-toggle .track i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .18s}
    .app-toggle[aria-checked="true"] .track{background:var(--green)}
    .app-toggle[aria-checked="true"] .track i{transform:translateX(14px)}
    .app-toggle[aria-checked="true"]{color:var(--text)}
    #resAppList .app-icobtn{width:36px;height:36px;padding:0;border-radius:10px}
    #resAppList .app-icobtn svg.icon{width:16px;height:16px}
    .cred-row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--raised);transition:border-color .15s,transform .15s,background .15s}
    .cred-row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
    .cred-row.is-low::before{background:var(--amber)}
    .cred-row.is-zero::before{background:var(--line2)}
    .cred-row:hover{border-color:var(--line2);background:#1b202c}
    .cred-avatar{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
    .cred-info{flex:1;min-width:0}
    .cred-info b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cred-meta{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;margin-top:5px}
    .cred-chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--field);border:1px solid var(--line)}
    .cred-chip svg.icon{width:11px;height:11px}
    .cred-chip.link{color:var(--blue2);border-color:rgba(91,141,239,.35);background:rgba(91,141,239,.1)}
    .cred-amount{flex:none;min-width:58px;padding:6px 12px;border-radius:12px;text-align:center;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(--green)}
    .cred-amount strong{display:block;font-size:19px;font-weight:800;line-height:1.1}
    .cred-amount span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
    .cred-row.is-low .cred-amount{background:rgba(245,183,61,.1);border-color:rgba(245,183,61,.35);color:var(--amber)}
    .cred-row.is-zero .cred-amount{background:var(--field);border-color:var(--line);color:var(--muted)}
    .cred-row .kr-actions>button{margin:0}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .search-wrap{position:relative;flex:1 1 200px;min-width:0}
    .search-wrap svg.icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
    .search-wrap input{padding-left:36px;margin:0}
    #refreshBtn{flex:none;white-space:nowrap}

    /* Generate modal */
    .fab{position:fixed;right:20px;bottom:20px;z-index:50;width:56px;height:56px;padding:0;border-radius:50%;box-shadow:0 10px 26px rgba(91,141,239,.4)}
    .fab svg.icon{width:24px;height:24px}
    .gen-overlay,.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,10,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .gen-modal{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;margin:0;animation:rise .22s cubic-bezier(.16,1,.3,1)}
    .gen-close{width:34px;height:34px;padding:0}
    .gen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
    .gen-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .gen-field label{display:flex;align-items:center;gap:6px;margin:0}
    .gen-field label svg.icon{display:none}
    .gen-field label .req{color:var(--red)}
    .gen-field input,.gen-field select{margin:0;height:44px}
    .paste-wrap{position:relative;display:flex}
    .paste-wrap input{padding-right:50px}
    .paste-wrap button{position:absolute;right:4px;top:4px;width:36px;height:36px;padding:0;border-radius:8px}
    .paste-wrap button svg.icon{width:16px;height:16px}
    .gen-field-submit,.gen-field-wide{grid-column:1/-1}
    .gen-field-submit label{display:none}
    #genBtn{width:100%;height:46px;font-size:14px}
    #genBtn svg.icon{width:16px;height:16px}
    .result.gen-result{margin-top:16px;border-radius:12px;overflow:hidden;background:rgba(62,207,142,.06);border:1px solid rgba(62,207,142,.3)}
    .gen-result-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#86efac;background:rgba(62,207,142,.1)}
    .gen-result-body{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
    .gen-key-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;background:var(--field);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
    .gen-key-chip:hover{border-color:rgba(91,141,239,.5)}
    .gen-key-chip code{font-size:13px}
    .gen-key-chip svg.icon{width:14px;height:14px;color:var(--muted)}

    /* Dialogs */
    .confirm-overlay{z-index:150}
    .modal-box{width:100%;max-width:360px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);animation:rise .2s cubic-bezier(.16,1,.3,1)}
    .confirm-title{margin:0 0 6px;font-size:16px;font-weight:700}
    .confirm-text{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5;word-break:break-word}
    .confirm-box input{margin-bottom:16px;height:44px;text-align:center;font-size:16px;font-weight:700}
    .confirm-actions,.modal-actions{display:flex;gap:10px}
    .confirm-actions button{flex:1}
    .modal-actions{justify-content:flex-end}
    .modal-sub{margin:0 0 14px;color:var(--muted);font-size:13px}
    .modal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .modal-ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(91,141,239,.14);color:var(--blue2)}
    .modal-ic svg.icon{width:19px;height:19px}
    .modal-head b{display:block;font-size:15.5px;font-weight:700}
    .modal-head small{display:block;margin-top:1px;color:var(--muted);font-size:12.5px;word-break:break-all}
    .modal-hint{margin:-4px 0 16px;color:var(--muted);font-size:12px;text-align:center}
    .modal-actions button{flex:1}
    .modal-stepper{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .modal-stepper button{width:44px;height:44px;padding:0;font-size:20px;background:var(--raised);border-color:var(--line2);color:var(--text);flex:none}
    .modal-stepper input{margin:0;height:44px;text-align:center;font-size:18px;font-weight:700}

    /* Toast */
    .toast-stack{position:fixed;left:50%;bottom:88px;z-index:200;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
    .toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.5);animation:rise .18s ease-out;max-width:360px}
    .toast.leaving{opacity:0;transform:translateY(6px);transition:.15s}
    .toast-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex:none}
    .toast-icon svg.icon{width:18px;height:18px}
    .toast.ok .toast-icon{color:var(--green)}
    .toast.err .toast-icon{color:var(--red)}
    .toast.info .toast-icon{color:var(--blue2)}
    .toast-text{flex:1;min-width:0;font-size:13px;line-height:1.35;word-break:break-word}
    .toast .toast-close{padding:4px;background:transparent;color:var(--muted);border:0}
    .toast .toast-close:hover:not(:disabled){background:var(--raised);color:var(--text)}
    .toast .toast-close svg.icon{width:12px;height:12px}

    @media (max-width:640px){
      .wrap{padding:0 14px 110px}
      .topbar{padding:10px 14px;margin-bottom:18px}
      .who-pill .who-text{display:none}
      .card{padding:16px}
      .gen-grid{grid-template-columns:1fr}
      .kv-summary{gap:6px}
      .kv-sum b{font-size:17px}
      #keyCard{padding:14px}
      .gen-overlay{align-items:flex-end;padding:0}
      .gen-modal{max-width:none;border-radius:18px 18px 0 0;max-height:90vh}
      .res-row{flex-wrap:wrap}
      #resAppList .app-row{flex-wrap:wrap;padding:12px}
      .app-grip{display:none}
      .app-main{flex-basis:100%}
      .app-actions{flex-basis:100%;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line)}
      .app-actions .app-btns{display:flex;gap:6px}
      .app-ava{width:42px;height:42px;font-size:16px}
      .cred-row{flex-wrap:nowrap;gap:10px;padding:11px 8px 11px 12px}
      .cred-avatar{width:38px;height:38px;font-size:15px}
      .cred-amount{min-width:50px;padding:5px 9px}
      .cred-stat{padding:10px 12px}
      .cred-stat b{font-size:18px}
      .kr-menu{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;box-shadow:0 0 0 100vmax rgba(4,6,10,.65)}
      .kr-menu-head{display:flex}
      .kr-menu button{min-height:50px;font-size:15.5px;padding:12px 14px}
      .toast-stack{bottom:90px}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAI9d8eTeVafEdQicjwcLaYRUA75xYDmQI",

      storageBucket: "tarzmodz-1dbab.firebasestorage.app",
      messagingSenderId: "886882124675",
      appId: "1:886882124675:web:6255a2b03a30e21fb1ecb6"
    };
    const PUBLIC_PATH = 'licenses';
    const PRIVATE_PATH = 'adminKeys';
    const DEVICE_PATH = 'deviceRegs';
    const RESELLER_PATH = 'resellerKeys'; // antrian key dari web reseller
    const DELETE_PATH = 'resellerDeletes'; // permintaan hapus key dari web reseller
    const APPS_PATH = 'resellerApps';     // daftar App ID publik untuk web reseller
    const APP_ID_FIELD = 'app';
    const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    const $ = (id) => document.getElementById(id);
    const state = { records: {}, devices: {}, devicesOk: true, tab: 'reseller', view: 'reseller', credTab: 'credit', viewUser: null, keyFilter: 'all', resellerApps: {}, users: {} };
    // Key lama tanpa field tier otomatis dianggap VIP
    function tierOf(record) { return record && record.tier === 'free' ? 'free' : 'vip'; }
    function isRes(record) { return !!(record && record.reseller); }
    function buildApps() { return state.resellerApps || {}; }
    const labels = { active: 'Aktif', expired: 'Expired', disabled: 'Nonaktif' };

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.database();

    function normalizeCode(value) {
      return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    async function sha256Hex(value) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function makeCode() {
      const raw = new Uint32Array(5);
      crypto.getRandomValues(raw);
      let value = '';
      for (const n of raw) value += ALPHABET[n % ALPHABET.length];
      return 'TARZ-' + value;
    }

    function statusOf(record) {
      if (record.off) return 'disabled';
      if (record.exp && record.exp < Date.now()) return 'expired';
      return 'active';
    }

    function allRecords() {
      return Object.keys(state.records)
        .map((h) => Object.assign({ h }, state.records[h]))
        .sort((a, b) => {
          const ta = a.createdAt ? Date.parse(a.createdAt) : 0;
          const tb = b.createdAt ? Date.parse(b.createdAt) : 0;
          return tb - ta;
        });
    }

    function buildLicensesPayload(records) {
      return {
        version: 1,
        updatedAt: new Date().toISOString(),
        keys: Object.keys(records).map((h) => {
          const r = records[h];
          const max = Math.max(parseInt(r.max, 10) || 0, 0);
          return { h, app: r.app || '', exp: r.exp || 0, off: !!r.off, max };
        })
      };
    }

    function deviceCount(hash) {
      const entry = state.devices[hash];
      if (!entry || typeof entry !== 'object') return 0;
      return Object.keys(entry).length;
    }

    function maxOf(record) {
      return Math.max(parseInt(record.max, 10) || 0, 0);
    }

    function friendlyError(error) {
      const code = (error && error.code) || '';
      const map = {
        'auth/invalid-credential': 'Email atau password salah.',
        'auth/user-not-found': 'Email atau password salah.',
        'auth/wrong-password': 'Email atau password salah.',
        'auth/invalid-email': 'Format email tidak valid.',
        'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu sebentar.',
        'auth/network-request-failed': 'Tidak bisa terhubung. Cek internet.',
        'auth/operation-not-allowed': 'Login Email/Password belum diaktifkan di Firebase Console (Authentication > Sign-in method).',
        'auth/user-disabled': 'Akun ini dinonaktifkan.',
        'PERMISSION_DENIED': 'Rules Firebase menolak. Paste database.rules.json ke Realtime Database > Rules.'
      };
      if (map[code]) return map[code];
      if (String(code).indexOf('PERMISSION_DENIED') >= 0) return map.PERMISSION_DENIED;
      return (error && error.message) || 'Terjadi kesalahan.';
    }

    function setMsg(id, text, kind) {
      const el = $(id);
      el.textContent = text || '';
      el.className = 'msg' + (kind ? ' ' + kind : '');
    }

    const LOGIN_MSG_ICONS = {
      err: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>',
      ok: '<svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
      info: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>'
    };
    function setLoginMsg(text, kind) {
      const el = $('loginMsg');
      if (!text) {
        el.textContent = '';
        el.className = 'login-msg';
        return;
      }
      const icon = LOGIN_MSG_ICONS[kind] || LOGIN_MSG_ICONS.info;
      el.innerHTML = icon + '<span>' + text + '</span>';
      el.className = 'login-msg' + (kind ? ' ' + kind : ' info');
    }

    const TOAST_ICONS = {
      ok: '<svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
      err: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>',
      info: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>'
    };

    function showToast(text, kind) {
      if (!text) return;
      const type = kind === 'err' ? 'err' : kind === 'info' ? 'info' : 'ok';
      const stack = $('toastStack');
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;

      const icon = document.createElement('div');
      icon.className = 'toast-icon';
      icon.innerHTML = TOAST_ICONS[type];
      toast.appendChild(icon);

      const msg = document.createElement('div');
      msg.className = 'toast-text';
      msg.textContent = text;
      toast.appendChild(msg);

      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'toast-close';
      close.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
      const dismiss = () => {
        toast.classList.add('leaving');
        setTimeout(() => toast.remove(), 150);
      };
      close.addEventListener('click', dismiss);
      toast.appendChild(close);

      stack.appendChild(toast);
      setTimeout(dismiss, 4000);
    }

    async function copyKeyCode(code) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
        } else {
          const ta = document.createElement('textarea');
          ta.value = code;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast('Key disalin: ' + code, 'ok');
      } catch (error) {
        showToast('Gagal menyalin key.', 'err');
      }
    }

    function countdownOf(exp) {
      if (!exp) return { text: 'Selamanya', cls: 'exp-never' };
      const diff = exp - Date.now();
      if (diff <= 0) return { text: 'Kedaluwarsa', cls: 'exp-out' };
      const totalMin = Math.floor(diff / 60000);
      const days = Math.floor(totalMin / 1440);
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;
      const parts = [];
      if (days > 0) parts.push(days + 'h');
      if (days > 0 || hours > 0) parts.push(hours + 'j');
      parts.push(mins + 'm');
      return { text: parts.join(' '), cls: days < 1 ? 'exp-soon' : '' };
    }

    function render() {
      const everything = allRecords();
      $('countVip').textContent = everything.filter((r) => !isRes(r) && tierOf(r) === 'vip').length;
      $('countFree').textContent = everything.filter((r) => !isRes(r) && tierOf(r) === 'free').length;
      $('countRes').textContent = everything.filter(isRes).length;
      document.querySelectorAll('#tabs .tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
      document.querySelectorAll('#mainNav .tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
      const isR = state.view === 'reseller';
      $('tabs').classList.toggle('hidden', isR);
      $('resApps').classList.toggle('hidden', !isR);
      $('genFab').title = $('genFab').ariaLabel = isR ? 'Tambah App ID' : 'Generate key';
      $('resCredits').classList.toggle('hidden', !isR);
      $('keyCard').classList.toggle('hidden', !state.viewUser);
      if (isR) { renderCredits(); renderResApps(); }
      const allRes = everything.filter(isRes);
      const all = state.viewUser ? allRes.filter((r) => r.by === state.viewUser) : allRes;
      $('total').textContent = allRes.length;
      $('active').textContent = Object.keys(state.users).length;

      if (state.viewUser) {
        const vu = state.users[state.viewUser] || {};
        const nm = String(vu.name || 'Reseller');
        let hue = 0;
        for (let i = 0; i < nm.length; i++) hue = (hue * 31 + nm.charCodeAt(i)) % 360;
        const ava = $('keyAva');
        ava.style.background = 'linear-gradient(135deg, hsl(' + hue + ',55%,48%), hsl(' + ((hue + 40) % 360) + ',60%,36%))';
        ava.textContent = nm.trim().charAt(0) || '?';
        $('keyTitle').textContent = nm;
        const cnt = { active: 0, expired: 0, disabled: 0 };
        all.forEach((r) => { cnt[statusOf(r)]++; });
        $('keySub').textContent = all.length + ' key dibuat';
        const sum = $('keySummary');
        sum.replaceChildren();
        [['Total', all.length, ''], ['Aktif', cnt.active, 'g'], ['Kedaluwarsa', cnt.expired, 'r'], ['Nonaktif', cnt.disabled, 'a']].forEach(([lb, n, c]) => {
          const box = document.createElement('div');
          box.className = 'kv-sum ' + c;
          const bb = document.createElement('b'); bb.textContent = n;
          const sm = document.createElement('small'); sm.textContent = lb;
          box.append(bb, sm);
          sum.appendChild(box);
        });
        document.querySelectorAll('#keyFilters button').forEach((bt) => bt.classList.toggle('active', bt.dataset.kf === state.keyFilter));
      }

      const query = $('search').value.trim().toUpperCase();
      const filtered = all.filter((r) =>
        (state.keyFilter === 'all' || statusOf(r) === state.keyFilter) &&
        (!query || String(r.code || '').toUpperCase().includes(query) || String(r.note || '').toUpperCase().includes(query))
      );

      const list = $('keyList');

      if (filtered.length === 0) {
        list.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'keylist-empty';
        empty.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>' +
          '<span>' + ((query || state.keyFilter !== 'all') ? 'Tidak ada key yang cocok dengan pencarian/filter.' : 'Belum ada key reseller. Key muncul setelah reseller membuat key.') + '</span>';
        list.appendChild(empty);
        return;
      }

      const ICO = {
        dots: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>',
        close: '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        copy: '<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        clock: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
        phone: '<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
        extend: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>',

    // Menu aksi dipasang fixed di desktop supaya tidak terpotong area scroll daftar.
    function placeCredMenu(btn, menu) {
      if (window.innerWidth <= 640) { menu.style.cssText = ''; return; }
      const r = btn.getBoundingClientRect();
      const h = menu.offsetHeight;
      let top = r.bottom + 6;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 6 - h);
      menu.style.position = 'fixed';
      menu.style.right = 'auto';
      menu.style.left = Math.max(8, r.right - 220) + 'px';
      menu.style.top = top + 'px';
    }

    function openGiveCredit(uid) {
      const u = state.users[uid] || {};
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay confirm-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box confirm-box glass';
      const title = document.createElement('h3');
      title.className = 'confirm-title';
      title.textContent = 'Give Credit: ' + (u.name || uid);
      const text = document.createElement('p');
      text.className = 'confirm-text';
      text.textContent = 'Credit sekarang: ' + (parseInt(u.credit, 10) || 0) + '. Isi angka minus untuk mengurangi.';
      const input = document.createElement('input');
      input.type = 'number'; input.step = '1'; input.value = '10';
      const actions = document.createElement('div');
      actions.className = 'confirm-actions';
      const cancel = document.createElement('button');
      cancel.type = 'button'; cancel.className = 'secondary'; cancel.textContent = 'Batal';
      const ok = document.createElement('button');
      ok.type = 'button'; ok.className = 'green'; ok.textContent = 'Berikan';
      actions.append(cancel, ok);
      box.append(title, text, input, actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      cancel.addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      ok.addEventListener('click', async () => {
        const n = parseInt(input.value, 10);
        if (!n) { showToast('Isi jumlah credit.', 'err'); return; }
        ok.disabled = true;
        try {
          const res = await db.ref('users/' + uid + '/credit').transaction((c) => Math.max((parseInt(c, 10) || 0) + n, 0));
          if (!state.users[uid]) state.users[uid] = {};
          state.users[uid].credit = res.snapshot.val() || 0;
          close(); render();
          showToast('Credit ' + (u.name || '') + ': ' + state.users[uid].credit, 'ok');
        } catch (error) { ok.disabled = false; showToast(friendlyError(error), 'err'); }
      });
      input.focus(); input.select();
    }

    function appOrderOf(id) {
      const a = state.resellerApps[id];
      return a && Number.isFinite(a.order) ? a.order : 1e9;
    }
    function sortedAppIds() {
      return Object.keys(state.resellerApps).sort((a, b) => appOrderOf(a) - appOrderOf(b) || a.localeCompare(b));
    }
    function nextAppOrder() {
      const ids = sortedAppIds();
      ids.forEach((id, i) => { if (state.resellerApps[id]) state.resellerApps[id].order = i; });
      return ids.length;
    }

    async function saveResApp() {
      const id = $('resAppId').value.trim();
      const name = $('resAppName').value.trim();
      if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) { showToast('App ID hanya huruf, angka, - dan _.', 'err'); return; }
      const logo = $('resAppLogo').value.trim();
      const apk = $('resAppApk').value.trim();
      if (apk && !/^https?:\/\/\S{3,900}$/.test(apk)) { showToast('Link APK harus diawali http:// atau https://', 'err'); return; }

    async function load() {
      setMsg('listMsg', 'Memuat data...');
      const results = await Promise.all([
        db.ref(PRIVATE_PATH).once('value'),
        db.ref(PUBLIC_PATH).once('value'),
        db.ref(DEVICE_PATH).once('value').catch(() => null),
        db.ref(RESELLER_PATH).once('value').catch(() => null),
        db.ref(APPS_PATH).once('value').catch(() => null),
        db.ref(DELETE_PATH).once('value').catch(() => null),
        db.ref('users').once('value').catch(() => null)
      ]);
      const raw = results[0].val();
      state.records = raw && typeof raw === 'object' ? raw : {};
      const usersRaw = results[6] ? results[6].val() : null;
      state.users = usersRaw && typeof usersRaw === 'object' ? usersRaw : {};
      const appsRaw = results[4] ? results[4].val() : null;
      state.resellerApps = appsRaw && typeof appsRaw === 'object' ? appsRaw : {};
      const queued = results[3] ? results[3].val() : null;
      let merged = false;
      if (queued && typeof queued === 'object') {
        const upd = {};
        Object.keys(queued).forEach((h) => {
          const q = queued[h];
          if (!q || !q.code) return;
          if (!state.records[h]) {
            state.records[h] = {
              code: String(q.code), app: String(q.app || ''), exp: Math.max(parseInt(q.exp, 10) || 0, 0), off: false,
              max: Math.max(parseInt(q.max, 10) || 0, 0), note: String(q.note || '').slice(0, 80),
              tier: 'vip', reseller: true, by: String(q.by || ''), byName: String(q.byName || '').slice(0, 30), createdAt: q.createdAt || new Date().toISOString()
            };
          }
          upd[RESELLER_PATH + '/' + h] = null;
          merged = true;
        });
        if (merged) {
          upd[PUBLIC_PATH] = buildLicensesPayload(state.records);
          upd[PRIVATE_PATH] = state.records;
          upd[APPS_PATH] = buildApps(state.records);
          await db.ref().update(upd);
          showToast('Key reseller baru masuk ke License.', 'info');
        }
      }
      const delReq = results[5] ? results[5].val() : null;
      if (delReq && typeof delReq === 'object') {
        const upd = {};
        let removed = 0;
        Object.keys(delReq).forEach((h) => {
          if (state.records[h] && isRes(state.records[h])) {
            delete state.records[h];
            upd[DEVICE_PATH + '/' + h] = null;
            removed += 1;
          }
          upd[DELETE_PATH + '/' + h] = null;
        });
        upd[PUBLIC_PATH] = buildLicensesPayload(state.records);
        upd[PRIVATE_PATH] = state.records;
        await db.ref().update(upd);
        if (removed) showToast(removed + ' key reseller dihapus.', 'info');
      }
      const deviceSnapshot = results[2];
      const devices = deviceSnapshot ? deviceSnapshot.val() : null;
      state.devices = devices && typeof devices === 'object' ? devices : {};
      state.devicesOk = !!deviceSnapshot;
      if (!state.devicesOk) {
        setMsg('listMsg', '', '');
        showToast('Node deviceRegs gagal dibaca.', 'err');
      }
      if (!results[1].exists() && !merged) {
        await db.ref().update({
          [PUBLIC_PATH]: buildLicensesPayload(state.records),
          [PRIVATE_PATH]: state.records,
        [APPS_PATH]: buildApps(state.records)
        });
        if (state.devicesOk) {
          setMsg('listMsg', '');
          showToast(raw ? 'Node licenses dibuat ulang.' : 'Database masih kosong.', 'info');
        }
      } else if (state.devicesOk) {
        setMsg('listMsg', '');
      }
      render();
    }

    async function persist(silent) {
      setMsg('listMsg', 'Menyimpan...');
      await db.ref().update({
        [PUBLIC_PATH]: buildLicensesPayload(state.records),
        [PRIVATE_PATH]: state.records,
        [APPS_PATH]: buildApps(state.records)
      });
      setMsg('listMsg', '');
      if (!silent) showToast('Tersimpan di Firebase.', 'ok');

    async function generate() {
      const noteInput = $('genNote');
      const note = noteInput.value.trim();
      if (!note) {
        noteInput.focus();
        showToast('Title wajib diisi.', 'err');
        return;
      }
      const button = $('genBtn');
      button.disabled = true;
      button.classList.add('loading');
      try {
        const count = Math.min(Math.max(parseInt($('genCount').value, 10) || 1, 1), 200);
        const app = $('genAppId').value.trim() || 'app1';
        const days = Math.max(parseInt($('genExpiry').value, 10) || 0, 0);
        const max = Math.max(parseInt($('genMax').value, 10) || 0, 0);
        const tier = $('genTier').value === 'free' ? 'free' : 'vip';
        const exp = days > 0 ? Date.now() + days * 86400000 : 0;
        const created = [];
        for (let i = 0; i < count; i += 1) {
          const code = makeCode();
          const h = await sha256Hex(normalizeCode(code));
          state.records[h] = { code, app, exp, off: false, max, note, tier, createdAt: new Date().toISOString() };
          created.push(state.records[h]);
        }
        await persist();
        const resultBox = $('genResult');
        resultBox.classList.remove('hidden');
        resultBox.replaceChildren();

        const head = document.createElement('div');
        head.className = 'gen-result-head';
        head.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>' +
          (created.length === 1 ? '1 key ' + tier.toUpperCase() + ' berhasil dibuat' : created.length + ' key ' + tier.toUpperCase() + ' berhasil dibuat');
        resultBox.appendChild(head);

        const body = document.createElement('div');
        body.className = 'gen-result-body';
        created.forEach((record) => {
          const chip = document.createElement('div');
          chip.className = 'gen-key-chip';
          chip.title = 'Klik untuk salin';
          const code = document.createElement('code');
          code.textContent = record.code;
          const copyIcon = document.createElement('svg');
          copyIcon.setAttribute('class', 'icon');
          copyIcon.setAttribute('viewBox', '0 0 24 24');
          copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
          chip.appendChild(code);
          chip.appendChild(copyIcon);
          chip.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(record.code);
              showToast('Key disalin.', 'ok');
            } catch (error) {
              showToast('Gagal menyalin key.', 'err');
            }
          });
          body.appendChild(chip);
        });
        resultBox.appendChild(body);

        clearTimeout(window.__genResultTimeout);
        window.__genResultTimeout = setTimeout(() => {
          resultBox.classList.add('hidden');
          resultBox.replaceChildren();
        }, 3000);

        noteInput.value = '';
        state.tab = tier;
        render();
      } catch (error) {
        showToast(friendlyError(error), 'err');
      } finally {
        button.disabled = false;
        button.classList.remove('loading');
      }
    }

    async function action(event) {
      const menuToggle = event.target.closest('button[data-action="menu"]');
      if (menuToggle) {
        const menu = menuToggle.parentElement.querySelector('.kr-menu');
        const wasOpen = menu.classList.contains('open');
        document.querySelectorAll('.kr-menu.open').forEach((m) => m.classList.remove('open'));
        if (!wasOpen) menu.classList.add('open');
        return;
      }
      const closeBtn = event.target.closest('button[data-action="closemenu"]');
      if (closeBtn) {
        closeBtn.closest('.kr-menu').classList.remove('open');
        return;
      }
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const openMenu = button.closest('.kr-menu');
      if (openMenu) openMenu.classList.remove('open');
      const h = button.dataset.hash;
      const record = state.records[h];
      if (!record) return;
      try {
        if (button.dataset.action === 'delete') {
          if (!(await confirmDialog('Hapus key ' + (record.code || h) + ' beserta daftar device-nya?', { title: 'Hapus key', danger: true }))) return;
          delete state.records[h];
          const cleaned = await clearDevices(h);
          await persist(true);
          render();
          showToast(cleaned ? 'Key dihapus.' : 'Key dihapus, device gagal dihapus.', cleaned ? 'ok' : 'err');
          return;
        } else if (button.dataset.action === 'movetier') {
          const next = tierOf(record) === 'vip' ? 'free' : 'vip';
          record.tier = next;
          await persist(true);
          render();
          showToast('Key dipindah ke ' + next.toUpperCase() + '.', 'ok');
          return;
        } else if (button.dataset.action === 'toggle') {
          record.off = !record.off;
        } else if (button.dataset.action === 'extend') {
          const base = record.exp && record.exp > Date.now() ? record.exp : Date.now();
          record.exp = base + 30 * 86400000;
          record.off = false;
        } else if (button.dataset.action === 'editmax') {
          openEditMaxModal(h, record);
          return;
        } else if (button.dataset.action === 'resetkey') {
          if (!(await confirmDialog('Ganti key ' + (record.code || h) + ' dengan key baru? Key lama langsung tidak berlaku, daftar device tetap dipertahankan.', { title: 'Reset key' }))) return;
          let code = makeCode();
          let newHash = await sha256Hex(normalizeCode(code));
          while (state.records[newHash]) {
            code = makeCode();
            newHash = await sha256Hex(normalizeCode(code));
          }
          const updated = Object.assign({}, record, { code });
          delete state.records[h];
          state.records[newHash] = updated;
          let moved = true;
          const oldDevices = state.devices[h];
          if (oldDevices && typeof oldDevices === 'object' && Object.keys(oldDevices).length) {
            try {
              await db.ref(DEVICE_PATH + '/' + newHash).set(oldDevices);
              await db.ref(DEVICE_PATH + '/' + h).remove();
              state.devices[newHash] = oldDevices;
              delete state.devices[h];
            } catch (error) {
              moved = false;
            }
          }
          await persist(true);
          render();
          await copyKeyCode(code);
          if (!moved) showToast('Key diganti, tapi device gagal dipindah.', 'err');
          return;
        } else if (button.dataset.action === 'resetdev') {
          const used = deviceCount(h);
          if (!used) {
            showToast('Belum ada device terdaftar.', 'info');
            return;
          }
          if (!(await confirmDialog('Reset ' + used + ' device untuk key ' + (record.code || h) + '? Device harus install ulang / logout.', { title: 'Reset device', danger: true }))) return;
          const cleared = await clearDevices(h);
          if (cleared) {
            await load();
            showToast('Daftar device direset.', 'ok');
          } else {
            delete state.devices[h];
            render();
            showToast('Rules menolak penghapusan device.', 'err');
          }
          return;
        }
        await persist();
        render();
      } catch (error) {
        showToast(friendlyError(error), 'err');
      }
    }

    function confirmDialog(message, opts) {
      opts = opts || {};
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay confirm-overlay';
        const box = document.createElement('div');
        box.className = 'modal-box confirm-box glass';
        const title = document.createElement('h3');
        title.className = 'confirm-title';
        title.textContent = opts.title || 'Konfirmasi';
        const text = document.createElement('p');
        text.className = 'confirm-text';
        text.textContent = message;
        const actions = document.createElement('div');
        actions.className = 'confirm-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'secondary';
        cancelBtn.textContent = 'Batal';
        const okBtn = document.createElement('button');
        okBtn.type = 'button';
        if (opts.danger) okBtn.className = 'danger';
        okBtn.textContent = 'OK';
        actions.appendChild(cancelBtn);
        actions.appendChild(okBtn);
        box.appendChild(title);
        box.appendChild(text);
        box.appendChild(actions);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        const done = (val) => {
          document.removeEventListener('keydown', onKey, true);
          overlay.remove();
          resolve(val);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.stopPropagation(); done(false); }
        };
        document.addEventListener('keydown', onKey, true);
        cancelBtn.addEventListener('click', () => done(false));
        okBtn.addEventListener('click', () => done(true));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) done(false); });
        okBtn.focus();
      });
    }

    (function () {
      const list = $('resAppList');
      let timer = null, start = null, drag = null;
      const cancelTimer = () => { clearTimeout(timer); timer = null; };
      list.addEventListener('pointerdown', (e) => {
        if (e.button > 0 || e.target.closest('button')) return;
        const row = e.target.closest('.res-row');
        if (!row || !row.dataset.id) return;
        cancelTimer();
        start = { x: e.clientX, y: e.clientY, row };
        timer = setTimeout(begin, 420);
      });
      function begin() {
        timer = null;
        if (!start) return;
        const row = start.row;
        drag = { row, grab: start.y - row.getBoundingClientRect().top, y: start.y, before: sortedAppIds() };
        row.classList.add('dragging');
        list.classList.add('reordering');
        if (navigator.vibrate) navigator.vibrate(15);
        drag.iv = setInterval(() => {
          if (drag.y < 70) window.scrollBy(0, -10);
          else if (drag.y > window.innerHeight - 70) window.scrollBy(0, 10);
          place();
        }, 30);
      }
      function place() {
        const { row, grab, y } = drag;
        let ref = null;
        for (const o of list.querySelectorAll('.res-row')) {
          if (o === row) continue;
          const b = o.getBoundingClientRect();
          if (y < b.top + b.height / 2) { ref = o; break; }
        }
        if (row.nextElementSibling !== ref) list.insertBefore(row, ref);
        row.style.transform = '';
        const natural = row.getBoundingClientRect().top;
        row.style.transform = 'translateY(' + (y - grab - natural) + 'px)';
      }
      document.addEventListener('pointermove', (e) => {
        if (!drag) {
          if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) { cancelTimer(); start = null; }
          return;
        }
        e.preventDefault();
        drag.y = e.clientY;
        place();
      });
      document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
      list.addEventListener('contextmenu', (e) => { if (e.target.closest('.res-row')) e.preventDefault(); });
      function end(commit) {
        cancelTimer();
        start = null;
        if (!drag) return;
        const d = drag;
        drag = null;
        clearInterval(d.iv);
        d.row.classList.remove('dragging');
        d.row.style.transform = '';
        list.classList.remove('reordering');
        const ids = Array.from(list.querySelectorAll('.res-row')).map((r) => r.dataset.id);
        if (!commit || ids.join() === d.before.join()) { render(); return; }
        ids.forEach((id, i) => { if (state.resellerApps[id]) state.resellerApps[id].order = i; });
        db.ref(APPS_PATH).set(state.resellerApps)
          .then(() => showToast('Urutan disimpan.', 'ok'))
          .catch((error) => {
            d.before.forEach((id, i) => { if (state.resellerApps[id]) state.resellerApps[id].order = i; });
            render();
            showToast(friendlyError(error), 'err');
          });
      }
      document.addEventListener('pointerup', () => end(true));
      document.addEventListener('pointercancel', () => end(false));
    })();

    function openGen() { $('genOverlay').classList.remove('hidden'); setTimeout(() => $('genNote').focus(), 50); }
    function closeGen() { $('genOverlay').classList.add('hidden'); }
    function openResApp() { $('resAppOverlay').classList.remove('hidden'); setTimeout(() => $('resAppId').focus(), 50); }
    function closeResApp() { $('resAppOverlay').classList.add('hidden'); }
    $('genFab').addEventListener('click', () => { if (state.view === 'reseller') openResApp(); else openGen(); });
    $('resAppClose').addEventListener('click', closeResApp);
    document.querySelectorAll('.paste-btn').forEach((btn) => btn.addEventListener('click', async () => {
      const target = $(btn.dataset.target);
      try {
        const text = (await navigator.clipboard.readText()).trim();
        if (!text) { showToast('Clipboard kosong.', 'info'); return; }
        target.value = text;
        showToast('Link ditempel.', 'ok');
      } catch (error) {
        showToast('Tidak bisa membaca clipboard. Tempel manual.', 'err');
        target.focus();
      }
    }));
    $('resAppOverlay').addEventListener('click', (e) => { if (e.target === $('resAppOverlay')) closeResApp(); });
    $('genClose').addEventListener('click', closeGen);
    $('genOverlay').addEventListener('click', (e) => { if (e.target === $('genOverlay')) closeGen(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeGen(); closeResApp(); } });
    $('tabs').addEventListener('click', (e) => {
      const b = e.target.closest('.tab-btn');
      if (!b) return;
      state.tab = b.dataset.tab;
      render();
    });
    $('credSearch').addEventListener('input', renderCredits);
    $('credList').addEventListener('scroll', closeCredMenus, { passive: true });
    window.addEventListener('scroll', () => { if (window.innerWidth > 640) closeCredMenus(); }, { passive: true });
    window.addEventListener('resize', closeCredMenus);
    $('credTabs').addEventListener('click', (e) => {
      const b = e.target.closest('.tab-btn');
      if (!b) return;
      state.credTab = b.dataset.ctab;
      render();
    });
    $('keyList').addEventListener('click', action);
    $('refreshBtn').addEventListener('click', () => load().catch((error) => showToast(friendlyError(error), 'err')));
    $('logoutBtn').addEventListener('click', () => {
      const button = $('logoutBtn');
      button.disabled = true;
      auth.signOut()
        .catch((error) => showToast(friendlyError(error), 'err'))
        .finally(() => { button.disabled = false; });
    });
    $('search').addEventListener('input', () => {
      clearTimeout(window.__searchDebounce);
      window.__searchDebounce = setTimeout(render, 200);
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.kr-actions')) {
        document.querySelectorAll('.kr-menu.open').forEach((m) => m.classList.remove('open'));
      }
    });
  </script>
</body>
</html>
